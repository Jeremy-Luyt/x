name: Build U8 Diagnostics Windows EXE

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Test and package on Windows
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pywin32 comtypes

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Package U8 diagnostics tool
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean "U8诊断工具.spec"

      - name: Package U8Assistant manual helper
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean "U8Assistant.spec"

      - name: Upload U8 diagnostics executable
        uses: actions/upload-artifact@v4
        with:
          name: U8Assistant-windows
          path: |
            dist/U8诊断工具.exe
            dist/U8Assistant.exe
          if-no-files-found: error
          retention-days: 14
