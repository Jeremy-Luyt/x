name: Build U8Assistant Windows executables

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-win7-x86:
    name: Package Windows 7 x86 (Python 3.8 x86)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.8 x86
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Verify the packaging interpreter is 32-bit
        shell: pwsh
        run: |
          python -c "import platform; import struct; import sys; print(sys.version); print(platform.architecture()); print(struct.calcsize('P') * 8)"
          $pointerBits = python -c "import struct; print(struct.calcsize('P') * 8)"
          if ($pointerBits.Trim() -ne '32') {
            throw "Expected a 32-bit Python interpreter, got $pointerBits. Refusing to package."
          }

      - name: Install locked Win7 x86 binary dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-win7-x86.txt

      - name: Run tests with Python 3.8 x86
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Pre-render fixed teaching PDF for Win7 runtime
        shell: pwsh
        run: |
          python tools/render_pdf_pages.py --pdf "assets/业财税2023.pdf" --output "assets/rendered_pages" --dpi 150 --quality 84
          Get-ChildItem "assets/rendered_pages" -Filter "page_*.jpg" | Measure-Object | Select-Object Count
          Get-Item "assets/rendered_pages/manifest.json"

      - name: Package U8Assistant Win7 x86
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean "U8Assistant-Win7-x86.spec"

      - name: Package read-only diagnostics tool Win7 x86
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean "U8诊断工具-Win7-x86.spec"

      - name: Sign Win7 x86 executables when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            "UNSIGNED: No trusted Authenticode certificate configured." | Set-Content "dist/SIGNING-STATUS.txt" -Encoding utf8
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "u8assistant-signing.pfx"
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "signtool.exe was not found on the Windows runner." }
          foreach ($file in "dist/U8Assistant-Win7-x86.exe", "dist/U8诊断工具-Win7-x86.exe") {
            & $signTool sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $file" }
            & $signTool verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $file" }
          }
          "SIGNED: Authenticode verification passed." | Set-Content "dist/SIGNING-STATUS.txt" -Encoding utf8

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash "dist/U8Assistant-Win7-x86.exe", "dist/U8诊断工具-Win7-x86.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Record executable sizes
        shell: pwsh
        run: |
          Get-Item "dist/U8Assistant-Win7-x86.exe", "dist/U8诊断工具-Win7-x86.exe" |
            Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload Windows 7 x86 executables
        uses: actions/upload-artifact@v4
        with:
          name: U8Assistant-Win7-x86
          path: |
            dist/U8Assistant-Win7-x86.exe
            dist/U8诊断工具-Win7-x86.exe
            dist/SHA256SUMS.txt
            dist/SIGNING-STATUS.txt
          if-no-files-found: error
          retention-days: 14

  build-win10-x64:
    name: Package Windows 10/11 x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pywin32 comtypes

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Package U8 diagnostics tool
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean "U8诊断工具.spec"

      - name: Package U8Assistant manual helper
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean "U8Assistant.spec"

      - name: Sign Windows x64 executables when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            "UNSIGNED: No trusted Authenticode certificate configured." | Set-Content "dist/SIGNING-STATUS.txt" -Encoding utf8
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "u8assistant-signing.pfx"
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "signtool.exe was not found on the Windows runner." }
          foreach ($file in "dist/U8Assistant-Win10-x64.exe", "dist/U8诊断工具-Win10-x64.exe") {
            & $signTool sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $file" }
            & $signTool verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $file" }
          }
          "SIGNED: Authenticode verification passed." | Set-Content "dist/SIGNING-STATUS.txt" -Encoding utf8

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash "dist/U8Assistant-Win10-x64.exe", "dist/U8诊断工具-Win10-x64.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows 10/11 x64 executables
        uses: actions/upload-artifact@v4
        with:
          name: U8Assistant-Win10-x64
          path: |
            dist/U8诊断工具-Win10-x64.exe
            dist/U8Assistant-Win10-x64.exe
            dist/SHA256SUMS.txt
            dist/SIGNING-STATUS.txt
          if-no-files-found: error
          retention-days: 14
